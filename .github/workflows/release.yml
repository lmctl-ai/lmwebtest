name: release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-npm:
    # npm trusted publishing (OIDC): no stored token. @lmctl-ai/lmwebtest trusts this repository and workflow.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: use an npm that supports trusted publishing
        run: npm install --global npm@11
      - name: publish the package version in package.json if the registry does not have it
        shell: bash
        run: |
          set -euo pipefail
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on the registry; nothing to publish"
            exit 0
          fi
          tag=latest
          case "$version" in *-*) tag=next ;; esac
          npm publish --access public --provenance --tag "$tag"
