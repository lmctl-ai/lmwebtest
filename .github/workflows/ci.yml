name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    name: ubuntu-test
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: install lmscript
        run: npm install -g @lmctl-ai/lmctl@0.2.426

      - name: install dependencies
        run: npm ci

      - name: link lmwebtest
        run: npm link

      - name: install playwright browsers
        run: npm run browsers:install

      - name: run syntax check
        run: npm run check

      - name: run test suite
        run: npm test

      - name: run worked example
        run: lmscript examples/moonshot-pricing.lms

  webapp:
    name: webapp-offline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: install lmscript
        run: npm install -g @lmctl-ai/lmctl@latest

      - name: resolve tool versions
        id: resolve
        run: |
          LMMOCK_TAG=$(curl -fsSL --max-time 15 https://api.github.com/repos/lmctl-ai/lmmock/releases/latest 2>/dev/null | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/' || echo "v0.1.36")
          LMHTML_SHA=$(git ls-remote https://github.com/lmctl-ai/lmhtml.git HEAD 2>/dev/null | awk '{print $1}' || echo "HEAD")
          echo "lmmock_tag=${LMMOCK_TAG}" >> "$GITHUB_OUTPUT"
          echo "lmhtml_sha=${LMHTML_SHA}" >> "$GITHUB_OUTPUT"

      - name: cache binaries
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: bin/
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ steps.resolve.outputs.lmmock_tag }}-${{ steps.resolve.outputs.lmhtml_sha }}

      - name: install build tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq cmake build-essential

      - name: run offline integration test
        run: ./demo-app/run.sh

  neochart:
    name: neochart-live
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: install lmscript
        run: npm install -g @lmctl-ai/lmctl@latest

      - name: resolve tool versions
        id: resolve
        run: |
          LMMOCK_TAG=$(curl -fsSL --max-time 15 https://api.github.com/repos/lmctl-ai/lmmock/releases/latest 2>/dev/null | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/' || echo "v0.1.36")
          LMHTML_SHA=$(git ls-remote https://github.com/lmctl-ai/lmhtml.git HEAD 2>/dev/null | awk '{print $1}' || echo "HEAD")
          echo "lmmock_tag=${LMMOCK_TAG}" >> "$GITHUB_OUTPUT"
          echo "lmhtml_sha=${LMHTML_SHA}" >> "$GITHUB_OUTPUT"

      - name: cache binaries
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: bin/
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ steps.resolve.outputs.lmmock_tag }}-${{ steps.resolve.outputs.lmhtml_sha }}

      - name: install build tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq cmake build-essential

      - name: run live integration test
        run: ./neochart/run.sh
